<div class="flex h-screen bg-gray-50 font-sans">
  <!-- BARRA LATERAL (SIDEBAR) -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between">
    <div>
      <div class="h-16 flex items-center px-6 border-b border-gray-100">
        <h1 class="text-xl font-bold text-gray-800">Gestor Documental</h1>
      </div>

      <nav class="p-4 space-y-2">
        <a routerLink="/dashboard/mi-unidad" 
          routerLinkActive="bg-blue-50 text-blue-700 font-semibold shadow-inner" 
          class="flex items-center px-4 py-3 text-sm text-gray-600 rounded-xl hover:bg-gray-50 transition-all cursor-pointer group">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"
            ></path>
          </svg>
          <span>Mi Unidad</span>
        </a>
        <a routerLink="/dashboard/papelera" 
         routerLinkActive="bg-blue-50 text-blue-700 font-semibold shadow-inner" 
         class="flex items-center px-4 py-3 text-sm text-gray-600 rounded-xl hover:bg-gray-50 transition-all cursor-pointer group mt-2">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
         <span>Papelera</span>
      </a>
      </nav>
    </div>

    <div class="p-4 border-t border-gray-200">
      @if (usuario()) {
        <div class="flex items-center mb-4">
          <div
            class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold shadow-sm"
          >
            {{ usuario()?.nombres?.charAt(0) }}
          </div>
          <div class="ml-3 overflow-hidden">
            <p class="text-sm font-medium text-gray-800 truncate">{{ usuario()?.nombres }}</p>
            <p class="text-xs text-gray-500 capitalize">{{ usuario()?.rol }}</p>
          </div>
        </div>
      }
      <button
        (click)="cerrarSesion()"
        class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
      >
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <router-outlet></router-outlet>
  </main>
</div>
