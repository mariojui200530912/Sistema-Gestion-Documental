<div 
  (click)="!modoPapelera() && onAbrir.emit()"
  [class.cursor-pointer]="!modoPapelera()"
  class="group relative bg-white border border-gray-200 rounded-xl p-4 hover:shadow-md hover:border-blue-300 transition-all flex items-center justify-between">
  
  <!-- LADO IZQUIERDO: ICONO + DETALLES -->
  <div class="flex items-center space-x-3 overflow-hidden pr-2">
    <svg class="w-8 h-8 text-blue-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
    </svg>
    
    <div class="flex flex-col overflow-hidden">
      <span class="text-sm font-semibold text-gray-800 truncate" [title]="carpeta().nombre">
        {{ carpeta().nombre }}
      </span>
      
      <!-- INSIGNIA DE PERMISO + PROPIETARIO (Solo en Compartidos) -->
      @if (mostrarInfoCompartido()) {
        <div class="flex items-center space-x-1.5 mt-1">
          @if (!modoCompartido()) {
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-green-100 text-green-800 border border-green-200">
              Editor
            </span>
          } @else {
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-gray-100 text-gray-600 border border-gray-200">
              Lector
            </span>
          }
          <span class="text-[11px] text-gray-500 truncate" [title]="'Propietario: ' + obtenerNombrePropietario()">
            • De: <strong class="font-medium text-gray-700">{{ obtenerNombrePropietario() }}</strong>
          </span>
        </div>
      }
    </div>
  </div>

  <!-- BOTÓN DE 3 PUNTOS -->
  @if (!modoCompartido() || modoPapelera()) {
    <button 
      (click)="onToggleMenu.emit($event)"
      class="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 opacity-80 group-hover:opacity-100 transition-opacity focus:outline-none flex-shrink-0"
      title="Opciones">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"></path>
      </svg>
    </button>
  }

  <!-- MENÚ DESPLEGABLE -->
  @if (menuActivo()) {
    <div class="absolute right-2 top-12 w-52 bg-white border border-gray-200 rounded-lg shadow-xl z-30 py-1" (click)="$event.stopPropagation()">
      @if (!modoPapelera()) {
        <!-- MENÚ NORMAL -->
        <button (click)="onCompartir.emit($event)" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
          <svg class="w-4 h-4 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
          Compartir
        </button>

        <button (click)="onRenombrar.emit($event)" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
          <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          Renombrar
        </button>

        <button (click)="onMover.emit($event)" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
          <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
          Mover
        </button>

        <div class="border-t border-gray-100 my-1"></div>

        <button (click)="onEliminar.emit($event)" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Eliminar
        </button>
      } @else {
        <!-- MENÚ PAPELERA -->
        <button (click)="onRestaurar.emit($event)" class="w-full text-left px-4 py-2 text-sm text-green-700 hover:bg-green-50 flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
          Restaurar
        </button>
        <div class="border-t border-gray-100 my-1"></div>
        <button (click)="onEliminarDefinitivo.emit($event)" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Eliminar definitivamente
        </button>
      }
    </div>
  }
</div>
