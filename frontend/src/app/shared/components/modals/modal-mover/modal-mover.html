<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up">
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
      <h3 class="text-lg font-bold text-gray-800">Mover a...</h3>
      <button (click)="onCerrar.emit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="p-6">
      <p class="text-sm text-gray-600 mb-4">Selecciona la carpeta destino para <strong>{{ itemSeleccionado()?.nombre }}</strong>:</p>
      <select [ngModel]="carpetaDestinoSeleccionada()" (ngModelChange)="onDestinoChange.emit($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <option [ngValue]="null">🏠 Mi Unidad (Raíz)</option>
        @for (carpeta of listaCarpetasDestino(); track carpeta._id) {
          <option [ngValue]="carpeta._id">📁 {{ carpeta.nombre }}</option>
        }
      </select>
    </div>
    <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 border-t border-gray-100">
      <button type="button" (click)="onCerrar.emit()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Cancelar</button>
      <button (click)="onMover.emit()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Mover aquí</button>
    </div>
  </div>
</div>
