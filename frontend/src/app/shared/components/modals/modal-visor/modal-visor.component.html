<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4" (click)="onCerrar.emit()">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl flex flex-col overflow-hidden h-[80vh]" (click)="$event.stopPropagation()">
    
    <!-- Cabecera -->
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 flex-shrink-0">
      <div class="flex items-center space-x-3 overflow-hidden">
        <svg class="w-6 h-6 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <h3 class="text-base font-bold text-gray-800 truncate" [title]="archivo().nombre">{{ archivo().nombre }}</h3>
      </div>
      <button (click)="onCerrar.emit()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Contenido -->
    <div class="flex-1 p-6 overflow-y-auto bg-white">
      @if (cargando()) {
        <div class="h-full flex items-center justify-center">
          <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
        </div>
      } @else {
        <pre class="font-mono text-sm text-gray-800 whitespace-pre-wrap break-words leading-relaxed">{{ contenido() }}</pre>
      }
    </div>
    
  </div>
</div>
