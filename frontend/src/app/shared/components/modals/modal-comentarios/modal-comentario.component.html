<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col overflow-hidden h-[600px] max-h-[90vh]">
    
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 flex-shrink-0">
      <div class="flex items-center space-x-3 overflow-hidden">
        <svg class="w-6 h-6 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        <div class="truncate">
          <h3 class="text-base font-bold text-gray-800 truncate">Comentarios</h3>
          <span class="text-xs text-gray-500">{{ item().nombre }}</span>
        </div>
      </div>
      <button (click)="onCerrar.emit()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="flex-1 p-6 overflow-y-auto bg-gray-50/50 space-y-4">
      @for (comentario of comentarios(); track comentario._id) {
        <div class="flex flex-col" [ngClass]="esMiComentario(comentario.usuario_id) ? 'items-end' : 'items-start'">
          <div class="flex items-baseline space-x-2 mb-1">
            <span class="text-[10px] font-bold text-gray-500">
              {{ obtenerNombreAutor(comentario) }}
            </span>
            <span class="text-[9px] text-gray-400">{{ comentario.createdAt | date:'short' }}</span>
          </div>
          <div class="px-4 py-2 rounded-2xl max-w-[85%] text-sm"
               [ngClass]="esMiComentario(comentario.usuario_id) ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border border-gray-200 text-gray-800 rounded-tl-none shadow-sm'">
            {{ comentario.texto }}
          </div>
        </div>
      } @empty {
        <div class="h-full flex flex-col items-center justify-center text-center">
          <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
          <p class="text-sm text-gray-500 font-medium">Aún no hay comentarios.</p>
          <p class="text-xs text-gray-400">Sé el primero en opinar sobre este elemento.</p>
        </div>
      }
    </div>

    <div class="p-4 bg-white border-t border-gray-200 flex items-center space-x-2 flex-shrink-0">
      <input 
        type="text" 
        [ngModel]="nuevoComentario()" 
        (ngModelChange)="nuevoComentario.set($event)"
        (keyup.enter)="enviarComentario()"
        placeholder="Escribe un comentario..." 
        class="flex-1 px-4 py-2 border border-gray-300 rounded-full text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [disabled]="enviando()">
      
      <button 
        (click)="enviarComentario()" 
        [disabled]="enviando() || !nuevoComentario().trim()"
        class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors shadow-sm">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
        </svg>
      </button>
    </div>

  </div>
</div>
