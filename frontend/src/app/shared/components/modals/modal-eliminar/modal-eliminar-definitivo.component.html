<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 transition-opacity">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
      <div class="px-6 py-6 sm:flex sm:items-start">
        <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
          <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left">
          <h3 class="text-lg font-bold leading-6 text-gray-900">Eliminar permanentemente</h3>
          <div class="mt-2">
            <p class="text-sm text-gray-500">
              ¿Estás seguro de que deseas eliminar definitivamente <span class="font-semibold text-gray-800">{{ item().nombre }}</span>? Esta acción no se puede deshacer y liberará espacio en tu almacenamiento.
            </p>
          </div>
        </div>
      </div>
      <div class="bg-gray-50 px-6 py-4 sm:flex sm:flex-row-reverse border-t border-gray-100">
        <button type="button" (click)="eliminar()" class="inline-flex w-full justify-center rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-red-700 sm:ml-3 sm:w-auto transition-colors flex items-center disabled:opacity-50" [disabled]="procesando()">
          @if (procesando()) {
            Moviendo...
          } @else {
            Eliminar para siempre
          }
        </button>
        <button type="button" (click)="onCerrar.emit()" class="mt-3 inline-flex w-full justify-center rounded-lg bg-white px-4 py-2 text-sm font-medium text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto transition-colors focus:outline-none" [disabled]="procesando()">Cancelar</button>
      </div>
    </div>
  </div>
