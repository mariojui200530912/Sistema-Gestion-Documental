<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 transition-opacity">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
    
    <!-- CUERPO DEL MODAL (Sin cabecera para un look más de "Alerta") -->
    <div class="px-6 py-6 sm:flex sm:items-start">
      
      <!-- Icono de Advertencia / Papelera -->
      <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
        <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
        </svg>
      </div>
      
      <!-- Textos -->
      <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left">
        <h3 class="text-lg font-bold leading-6 text-gray-900" id="modal-title">
          Mover a la papelera
        </h3>
        <div class="mt-2">
          <p class="text-sm text-gray-500">
            ¿Estás seguro de que deseas mover 
            <span class="font-semibold text-gray-800">{{ item()?.nombre }}</span> a la papelera? 
            <br><br>
            Aún podrás restaurarlo más tarde desde la sección de Papelera.
          </p>
        </div>
      </div>
    </div>

    <!-- PIE / BOTONES -->
    <div class="bg-gray-50 px-6 py-4 sm:flex sm:flex-row-reverse border-t border-gray-100">
      <button 
        type="button" 
        (click)="confirmar()"
        class="inline-flex w-full justify-center rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-red-700 sm:ml-3 sm:w-auto transition-colors disabled:opacity-50 flex items-center"
        [disabled]="procesando()">
        
        @if (procesando()) {
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Moviendo...
        } @else {
          Sí, mover a papelera
        }
      </button>
      
      <button 
        type="button" 
        (click)="onCerrar.emit()"
        class="mt-3 inline-flex w-full justify-center rounded-lg bg-white px-4 py-2 text-sm font-medium text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto transition-colors focus:outline-none"
        [disabled]="procesando()">
        Cancelar
      </button>
    </div>
    
  </div>
</div>
