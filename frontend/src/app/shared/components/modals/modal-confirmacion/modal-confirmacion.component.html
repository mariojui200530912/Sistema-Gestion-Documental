<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up">
    
    <div class="px-6 py-4 border-b border-gray-100 flex items-center">
      @if (esPeligroso()) {
        <svg class="w-6 h-6 mr-3 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      } @else {
        <svg class="w-6 h-6 mr-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      }
      <h3 class="text-lg font-bold text-gray-800">{{ titulo() }}</h3>
    </div>

    <div class="p-6">
      <p class="text-gray-600 text-sm leading-relaxed">{{ mensaje() }}</p>
    </div>

    <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 border-t border-gray-100">
      <button type="button" (click)="onCancelar.emit()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
        Cancelar
      </button>
      <button (click)="onConfirmar.emit()" 
              [ngClass]="esPeligroso() ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'"
              class="px-4 py-2 text-sm font-medium text-white border border-transparent rounded-lg transition-colors">
        {{ textoBoton() }}
      </button>
    </div>

  </div>
</div>
