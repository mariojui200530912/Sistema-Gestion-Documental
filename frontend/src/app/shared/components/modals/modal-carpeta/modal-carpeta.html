<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up">
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
      <h3 class="text-lg font-bold text-gray-800">Nueva Carpeta</h3>
      <button (click)="onCerrar.emit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <form [formGroup]="form()" (ngSubmit)="onGuardar.emit()">
      <div class="p-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de la carpeta</label>
        <input type="text" formControlName="nombre" placeholder="Ej. Reportes 2026" autofocus class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        <span *ngIf="form().get('nombre')?.touched && form().get('nombre')?.invalid" class="text-red-500 text-xs mt-2 block">El nombre es obligatorio.</span>
      </div>
      <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 border-t border-gray-100">
        <button type="button" (click)="onCerrar.emit()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Cancelar</button>
        <button type="submit" [disabled]="form().invalid" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:bg-blue-300 transition-colors">Crear</button>
      </div>
    </form>
  </div>
</div>
