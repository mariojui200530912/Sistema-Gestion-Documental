<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up">
    
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h3 class="text-lg font-bold text-gray-800 flex items-center">
        <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        Compartir {{ tipoItem() === 'carpeta' ? 'Carpeta' : 'Archivo' }}
      </h3>
      <button (click)="onCerrar.emit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="p-6 space-y-4">
        
        <div class="flex items-center p-3 bg-blue-50/50 rounded-lg border border-blue-100 mb-4">
          <svg class="w-8 h-8 text-blue-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
            @if (tipoItem() === 'carpeta') {
              <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
            } @else {
              <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"></path>
            }
          </svg>
          <span class="text-sm font-medium text-gray-700 truncate">{{ itemSeleccionado()?.nombre }}</span>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico del usuario</label>
          <input type="email" formControlName="correo" placeholder="ejemplo@correo.com" autofocus
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          @if (form.get('correo')?.touched && form.get('correo')?.invalid) {
            <span class="text-red-500 text-xs mt-1 block">Ingresa un correo válido.</span>
          }
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nivel de permiso</label>
          <select formControlName="permiso" class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            <option value="lectura">👀 Lector (Solo puede ver y descargar)</option>
            <option value="comentar">💬 Comentador (Puede ver y añadir notas)</option>
            <option value="edicion">✏️ Editor (Puede modificar y eliminar)</option>
          </select>
        </div>

      </div>

      <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 border-t border-gray-100">
        <button type="button" (click)="onCerrar.emit()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid || compartiendo()"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:bg-blue-300 transition-colors flex items-center">
          @if (compartiendo()) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Compartiendo...
          } @else {
            Compartir
          }
        </button>
      </div>
    </form>
  </div>
</div>
