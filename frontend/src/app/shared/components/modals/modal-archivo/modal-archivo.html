<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 transition-opacity">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
    
    <!-- CABECERA -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
      <h3 class="text-lg font-bold text-gray-800">Subir Nuevo Archivo</h3>
      <button (click)="onCerrar.emit()" class="text-gray-400 hover:text-gray-600 transition-colors focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- CUERPO / ÁREA DE SELECCIÓN -->
    <div class="px-6 py-6">
      <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-all relative">
        <div class="space-y-1 text-center">
          
          <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          
          <div class="flex text-sm text-gray-600 justify-center">
            <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none">
              <span>Seleccionar archivo</span>
              <input id="file-upload" type="file" class="sr-only" (change)="onSeleccionar($event)">
            </label>
          </div>
          
          <p class="text-xs text-gray-500 mt-2 font-medium">
            {{ archivoSeleccionado() ? archivoSeleccionado()?.name : 'Haz clic para explorar' }}
          </p>
        </div>
      </div>
    </div>

    <!-- PIE / BOTONES -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end space-x-3">
      <button 
        type="button" 
        (click)="onCerrar.emit()" 
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none transition-colors" 
        [disabled]="subiendoArchivo()">
        Cancelar
      </button>
      
      <button 
        type="button" 
        (click)="subirArchivo()" 
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none flex items-center transition-colors shadow-sm disabled:opacity-50" 
        [disabled]="!archivoSeleccionado() || subiendoArchivo()">
        
        @if (subiendoArchivo()) {
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Subiendo...
        } @else {
          Subir Archivo
        }
      </button>
    </div>
    
  </div>
</div>
