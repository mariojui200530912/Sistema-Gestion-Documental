@if (toast().visible) {
  <div class="fixed bottom-5 right-5 z-[100] transform transition-all duration-300 ease-out">
    <div [ngClass]="{
          'bg-green-50 border-green-500 text-green-800': toast().tipo === 'success',
          'bg-red-50 border-red-500 text-red-800': toast().tipo === 'error'
         }" 
         class="flex items-center p-4 border-l-4 rounded-lg shadow-xl min-w-[300px]">
      
      <!-- Icono de Éxito -->
      @if (toast().tipo === 'success') {
        <svg class="w-6 h-6 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      }
      <!-- Icono de Error -->
      @if (toast().tipo === 'error') {
        <svg class="w-6 h-6 mr-3 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      }

      <span class="font-medium text-sm flex-1">{{ toast().mensaje }}</span>

      <!-- Boton de cerrar manual -->
      <button (click)="toastService.ocultar()" class="ml-4 opacity-50 hover:opacity-100 transition-opacity">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>
}
